// Top-level build file where you can add configuration options common to all sub-projects/modules.

// Versions live in gradle/libs.versions.toml.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath libs.android.gradle.plugin
        classpath libs.kotlin.gradle.plugin

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    alias(libs.plugins.sonarqube)
    alias(libs.plugins.ktlint) apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

sonar {
    properties {
        property 'sonar.projectKey', 'jtn0123_MaterialFiles'
        property 'sonar.projectName', 'MaterialFiles'
        property 'sonar.organization', 'jtn0123ismysonar'
        property 'sonar.host.url', 'https://sonarcloud.io'
        // Keep native C analysis when switching away from automatic analysis.
        property 'sonar.cfamily.compile-commands',
            "${rootDir}/app/.cxx/tools/debug/arm64-v8a/compile_commands.json"
        // CI downloads the independently generated unit and device XML reports here.
        property 'sonar.coverage.jacoco.xmlReportPaths',
            "${rootDir}/coverage/**/*.xml"
        // Findings reviewed and accepted, each limited to the rule and the files it was raised in
        // (as patterns, since paths are relative to the module in a multi-module analysis).
        def ignoredIssues = [
            // Browsing external storage is what a file manager is for; these name its standard
            // folders (the default one, Downloads, Pictures, Screenshots).
            externalStorage: ['kotlin:S5324', [
                '**/src/main/java/me/zhanghai/android/files/filelist/FileListPick.kt',
                '**/src/main/java/me/zhanghai/android/files/navigation/NavigationItems.kt',
                '**/src/main/java/me/zhanghai/android/files/settings/Settings.kt',
                '**/src/main/java/me/zhanghai/android/files/viewer/saveas/SaveAsActivity.kt'
            ]],
            // WebDAV, CalDAV and CardDAV XML namespace names, which are identifiers and never
            // fetched.
            xmlNamespaces: ['kotlin:S5332', [
                '**/src/main/kotlin/at/bitfire/dav4jvm/XmlUtils.kt',
                '**/src/main/kotlin/at/bitfire/dav4jvm/property/caldav/namespace.kt'
            ]],
            // The Shizuku provider only hands the Shizuku app its binder, and Shizuku requires
            // this one system permission for it.
            shizukuProvider: ['xml:S6361', ['**/src/main/AndroidManifest.xml']],
            // WebView debugging is only turned on when BuildConfig.DEBUG.
            debugWebView: ['kotlin:S4507', [
                '**/src/main/java/me/zhanghai/android/files/app/AppInitializers.kt'
            ]],
            // ByteStringBuilder.append() is not deprecated; the Kotlin compiler warns about
            // nothing here.
            byteStringAppend: ['kotlin:S1874', [
                '**/src/main/java/me/zhanghai/android/files/filelist/CollatorFileNameExtensions.kt'
            ]],
            // Both call Geocoder through awaitGetFromLocation(), which is already on
            // Dispatchers.IO.
            geocoderOnIo: ['kotlin:S6307', [
                '**/src/main/java/me/zhanghai/android/files/fileproperties/image/FilePropertiesImageTabFragment.kt',
                '**/src/main/java/me/zhanghai/android/files/fileproperties/video/FilePropertiesVideoTabFragment.kt'
            ]],
            // FileChannel and MediaDataSource are abstract classes, so Kotlin cannot delegate to
            // them with "by".
            abstractDelegate: ['kotlin:S6514', [
                '**/src/main/java/me/zhanghai/android/files/provider/common/DelegateFileChannel.kt',
                '**/src/main/java/me/zhanghai/android/files/util/MediaMetadataRetrieverPathExtensions.kt'
            ]],
            // The JNI code looks these fields up by name.
            syscallFieldNames: ['kotlin:S117', [
                '**/src/main/java/me/zhanghai/android/files/provider/linux/syscall/StructTimespec.kt'
            ]],
            // The syscall wrappers are named after the C functions they call.
            syscallFunctionNames: ['kotlin:S100', [
                '**/src/main/java/me/zhanghai/android/files/provider/linux/syscall/Syscall.kt'
            ]],
            // Replacing the deprecated soft input calls means driving the keyboard insets by
            // hand, which changes how these dialogs behave; worth its own change.
            softInput: ['kotlin:S1874', [
                '**/src/main/java/me/zhanghai/android/files/fileaction/ArchivePasswordDialogFragment.kt',
                '**/src/main/java/me/zhanghai/android/files/filejob/FileJobConflictDialogFragment.kt',
                '**/src/main/java/me/zhanghai/android/files/util/ViewExtensions.kt'
            ]]
        ]
        def criteria = ignoredIssues.collectMany { name, ruleAndFiles ->
            def (rule, files) = ruleAndFiles
            files.withIndex().collect { file, index ->
                ["${name}${index}", rule, file]
            }
        }
        property 'sonar.issue.ignore.multicriteria', criteria.collect { it[0] }.join(',')
        criteria.each { key, rule, file ->
            property "sonar.issue.ignore.multicriteria.${key}.ruleKey", rule
            property "sonar.issue.ignore.multicriteria.${key}.resourceKey", file
        }
    }
}
