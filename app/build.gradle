apply plugin: 'com.android.application'
apply plugin: 'kotlin-parcelize'
apply plugin: 'org.jlleitschuh.gradle.ktlint'

apply from: '../signing.gradle'

//#ifdef NONFREE
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.6'
    }
}
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
//#endif

android {
    namespace 'me.zhanghai.android.files'
    buildToolsVersion = '37.0.0'
    compileSdk = 36
    ndkVersion '28.1.13356709'
    defaultConfig {
        applicationId 'me.zhanghai.android.files'
        minSdk 23
        // Not supporting foreground service timeout yet.
        //noinspection OldTargetApi
        targetSdk 34
        versionCode 39
        versionName '1.7.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        resValue 'string', 'app_version', versionName + ' (' + versionCode + ')'
        buildConfigField 'String', 'FILE_PROVIDIER_AUTHORITY', 'APPLICATION_ID + ".file_provider"'
        resValue 'string', 'app_provider_authority', applicationId + '.app_provider'
        resValue 'string', 'file_provider_authority', applicationId + '.file_provider'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
            }
        }
    }
    buildFeatures {
        aidl true
        buildConfig true
        resValues true
        viewBinding true
    }
    androidResources {
        generateLocaleConfig true
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
        }
    }
    lint {
        // For "Invalid package reference in library; not included in Android: javax.security.sasl.
        // Referenced from org.apache.mina.proxy.ProxyAuthException."
        warning 'InvalidPackage', 'MissingTranslation'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
//#ifdef NONFREE
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
            }
//#endif
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'org/bouncycastle/pqc/crypto/picnic/*'
            ]
        }
    }
    bundle {
        language {
            enableSplit = false
        }
    }
}

ktlint {
    version = '1.8.0'
    android = true
    // Existing violations are recorded in the baseline; new code is checked in full.
    baseline = file('ktlint-baseline.xml')
}

repositories {
    maven {
        url 'https://jitpack.io'
    }
}
dependencies {
    // See the pin comment in gradle/libs.versions.toml.
    implementation(libs.dav4jvm) {
        exclude group: 'org.ogce', module: 'xpp3'
    }
    implementation libs.photoview
    implementation libs.libsu.service
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.uiautomator

    coreLibraryDesugaring libs.desugar.jdk.libs

    // kotlinx-coroutines-android depends on kotlin-stdlib-jdk8
    implementation libs.kotlin.stdlib.jdk8
    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.coroutines.core

    implementation libs.androidx.activity.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation libs.androidx.drawerlayout
    implementation libs.androidx.exifinterface
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.lifecycle.common.java8
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.process
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.media3.common
    implementation libs.androidx.media3.datasource
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.ui
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefreshlayout
    implementation libs.material

    implementation libs.androidsvg
    implementation libs.subsampling.scale.image.view
    implementation libs.drawer
    implementation libs.materialshadowninepatch
    implementation libs.advrecyclerview
    // The SMBJ version is pinned; see gradle/libs.versions.toml.
    //noinspection NewerVersionAvailable
    implementation(libs.smbj) {
        // org.bouncycastle:bcprov-jdk15on uses bytecode version unsupported by Jetifier, so use
        // org.bouncycastle:bcprov-jdk15to18 instead.
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
    }
    implementation libs.bouncycastle.bcprov
    implementation(libs.sshj) {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
        exclude group: 'org.bouncycastle', module: 'bcpkix-jdk18on'
    }
    implementation libs.bouncycastle.bcpkix
    implementation libs.speed.dial
    implementation(libs.dcerpc) {
        // SMBJ-RPC depends on the JRE flavor of Guava which targets Java 8.
        exclude group: 'com.google.guava', module: 'guava'
        // Prevent promotion of SMBJ version to 0.12.2.
        exclude group: 'com.hierynomus', module: 'smbj'
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    implementation libs.guava
    // Guava conflicts with com.google.guava:listenablefuture:1.0 pulled in by AndroidX Core
    implementation libs.guava.listenablefuture
    implementation libs.preferencex
    implementation libs.commons.net
    // The LicensesDialog version is pinned; see gradle/libs.versions.toml.
    //noinspection NewerVersionAvailable
    implementation libs.licensesdialog
    implementation libs.simplemenu.preference
    implementation libs.shizuku.api
    implementation(libs.jcifs.ng) {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    implementation platform(libs.coil.bom)
    implementation libs.coil
    implementation libs.coil.gif
    implementation libs.coil.svg
    implementation libs.coil.video
    implementation libs.appiconloader
    implementation libs.fastscroll
    implementation libs.foregroundcompat
    implementation libs.libarchive
    implementation libs.libselinux
    implementation libs.retrofile
    implementation libs.systemuihelper
    implementation libs.ftpserver.core
    // Strictly 2.1.3; see gradle/libs.versions.toml.
    implementation libs.mina.core
    // Also a dependency of jCIFS-NG.
    implementation libs.slf4j.android

//#ifdef NONFREE
    implementation platform('com.google.firebase:firebase-bom:34.11.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics-ndk'
//#endif
}
