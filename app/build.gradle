apply plugin: 'com.android.application'
apply plugin: 'kotlin-parcelize'
apply plugin: 'org.jlleitschuh.gradle.ktlint'

apply from: '../signing.gradle'

android {
    namespace 'me.zhanghai.android.files'
    buildToolsVersion = '37.0.0'
    compileSdk = 37
    ndkVersion '28.1.13356709'
    defaultConfig {
        applicationId 'me.zhanghai.android.files'
        minSdk 35
        targetSdk 36
        versionCode 42
        versionName '1.7.7'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        resValue 'string', 'app_version', versionName + ' (' + versionCode + ')'
        buildConfigField 'String', 'FILE_PROVIDIER_AUTHORITY', 'APPLICATION_ID + ".file_provider"'
        resValue 'string', 'app_provider_authority', applicationId + '.app_provider'
        resValue 'string', 'file_provider_authority', applicationId + '.file_provider'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
            }
        }
    }
    buildFeatures {
        aidl true
        buildConfig true
        resValues true
        viewBinding true
    }
    androidResources {
        generateLocaleConfig true
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
        }
    }
    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
        }
    }
    lint {
        // For "Invalid package reference in library; not included in Android: javax.security.sasl.
        // Referenced from org.apache.mina.proxy.ProxyAuthException."
        warning 'InvalidPackage', 'MissingTranslation'
    }
    buildTypes {
        debug {
            // Opt in for coverage jobs; ordinary debug builds keep their normal runtime.
            def coverage = providers.gradleProperty('coverage').orNull == 'true'
            enableUnitTestCoverage = coverage
            enableAndroidTestCoverage = coverage
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    testCoverage {
        jacocoVersion = libs.versions.jacoco.get()
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'org/bouncycastle/pqc/crypto/picnic/*'
            ]
        }
    }
    bundle {
        language {
            enableSplit = false
        }
    }
}

// Hard limit on source file length. A file over it gets split, never exempted.
def maxSourceFileLines = 500
def sourceFiles = fileTree('src') { include '**/*.kt', '**/*.java' }
tasks.register('checkSourceFileLength') {
    group = 'verification'
    description = "Fails if any Kotlin or Java source file has more than $maxSourceFileLines lines."
    inputs.files(sourceFiles)
    def limit = maxSourceFileLines
    def projectDirPath = projectDir.toPath()
    doLast {
        def offenders = sourceFiles.files
            .collect { [file: it, lines: it.readLines().size()] }
            .findAll { it.lines > limit }
            .sort { -it.lines }
        if (!offenders.empty) {
            def report = offenders.collect {
                "  ${it.lines} lines  ${projectDirPath.relativize(it.file.toPath())}"
            }.join('\n')
            throw new GradleException(
                "${offenders.size()} source file(s) exceed $limit lines; split them:\n$report"
            )
        }
    }
}
tasks.named('check') { dependsOn 'checkSourceFileLength' }

ktlint {
    version = '1.8.0'
    android = true
}

repositories {
    maven {
        url 'https://jitpack.io'
    }
}
dependencies {
    // See the pin comment in gradle/libs.versions.toml.
    implementation project(':dav4jvm')
    implementation libs.okhttp
    implementation libs.photoview
    implementation libs.libsu.service
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    testImplementation libs.junit
    // The XmlPull API of the platform is a stub in unit tests; the JVM implementation the
    // vendored dav4jvm tests already use makes the WebDAV provider testable off-device.
    testImplementation libs.xpp3
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.uiautomator

    coreLibraryDesugaring libs.desugar.jdk.libs

    // kotlinx-coroutines-android depends on kotlin-stdlib-jdk8
    implementation libs.kotlin.stdlib.jdk8
    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.coroutines.core

    implementation libs.androidx.activity.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation libs.androidx.drawerlayout
    implementation libs.androidx.exifinterface
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.lifecycle.common.java8
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.process
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.media3.common
    implementation libs.androidx.media3.datasource
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.ui
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefreshlayout
    implementation libs.material

    implementation libs.androidsvg
    implementation libs.subsampling.scale.image.view
    implementation libs.drawer
    implementation libs.materialshadowninepatch
    implementation libs.advrecyclerview
    // The SMBJ version is pinned; see gradle/libs.versions.toml.
    //noinspection NewerVersionAvailable
    implementation(libs.smbj) {
        // Bouncy Castle comes from the jdk15to18 artifacts below; SMBJ 0.14 pulls the jdk18on
        // flavor, which duplicates every class.
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    implementation libs.bouncycastle.bcprov
    implementation(libs.sshj) {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
        exclude group: 'org.bouncycastle', module: 'bcpkix-jdk18on'
    }
    implementation libs.bouncycastle.bcpkix
    // bcutil 1.85 still ships IANAObjectIdentifiers, which bcprov 1.85 also has; 1.85.1 removed it.
    implementation libs.bouncycastle.bcutil
    implementation libs.speed.dial
    implementation(libs.dcerpc) {
        // SMBJ-RPC depends on the JRE flavor of Guava which targets Java 8.
        exclude group: 'com.google.guava', module: 'guava'
        // Prevent promotion of SMBJ version to 0.12.2.
        exclude group: 'com.hierynomus', module: 'smbj'
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    // Transitive dependency of dcerpc (3.4); see the advisory note in gradle/libs.versions.toml.
    implementation libs.commons.lang3
    implementation libs.guava
    // Guava conflicts with com.google.guava:listenablefuture:1.0 pulled in by AndroidX Core
    implementation libs.guava.listenablefuture
    implementation libs.commons.net
    // The LicensesDialog version is pinned; see gradle/libs.versions.toml.
    //noinspection NewerVersionAvailable
    implementation libs.licensesdialog
    implementation libs.simplemenu.preference
    implementation libs.shizuku.api
    implementation libs.shizuku.provider
    implementation(libs.jcifs.ng) {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    implementation platform(libs.coil.bom)
    implementation libs.coil
    implementation libs.coil.gif
    implementation libs.coil.svg
    implementation libs.coil.video
    implementation libs.appiconloader
    implementation libs.fastscroll
    implementation libs.foregroundcompat
    implementation libs.libarchive
    implementation libs.libselinux
    implementation libs.retrofile
    implementation libs.systemuihelper
    implementation libs.ftpserver.core
    implementation libs.mina.core
    // Also a dependency of jCIFS-NG.
    implementation libs.slf4j.android
}

// Real protocol tests run on the JVM; do not route their logging into Android stubs.
configurations.matching { it.name.endsWith('UnitTestRuntimeClasspath') }.configureEach {
    exclude group: 'org.slf4j', module: 'slf4j-android'
}
dependencies {
    testRuntimeOnly 'org.slf4j:slf4j-nop:1.7.36'
}

tasks.withType(Test).configureEach {
    def smbPort = providers.environmentVariable('MATERIAL_SMB_PORT').orNull
    if (smbPort != null) {
        systemProperty 'material.smb.port', smbPort
    }
    def smbContainer = providers.environmentVariable('MATERIAL_SMB_CONTAINER').orNull
    if (smbContainer != null) {
        systemProperty 'material.smb.container', smbContainer
    }
    def sftpPort = providers.environmentVariable('MATERIAL_SFTP_PORT').orNull
    if (sftpPort != null) {
        systemProperty 'material.sftp.port', sftpPort
    }
}

// An independent CLI invocation keeps touched-file formatting separate from global lint tasks.
configurations { ktlintCli }
dependencies { ktlintCli 'com.pinterest.ktlint:ktlint-cli:1.8.0:all' }
def selectedFormatFiles = providers.gradleProperty('formatFiles').orNull
if (selectedFormatFiles != null) {
    def selected = selectedFormatFiles.split(',').collect { file(it).absolutePath }
    ['formatSelected': true, 'checkSelected': false].each { taskName, format ->
        tasks.register(taskName, JavaExec) {
            classpath = configurations.ktlintCli
            mainClass = 'com.pinterest.ktlint.Main'
            workingDir = rootProject.projectDir
            if (format) args '--format'
            args selected
        }
    }
}
