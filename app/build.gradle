    implementation libs.androidsvg
    implementation libs.subsampling.scale.image.view
    implementation libs.drawer
    implementation libs.materialshadowninepatch
    implementation libs.advrecyclerview
    // The SMBJ version is pinned; see gradle/libs.versions.toml.
    //noinspection NewerVersionAvailable
    implementation(libs.smbj) {
        // org.bouncycastle:bcprov-jdk15on uses bytecode version unsupported by Jetifier, so use
        // org.bouncycastle:bcprov-jdk15to18 instead.
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
    }
    implementation libs.bouncycastle.bcprov
    implementation(libs.sshj) {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
        exclude group: 'org.bouncycastle', module: 'bcpkix-jdk18on'
    }
    implementation libs.bouncycastle.bcpkix
    // bcutil 1.85 still ships IANAObjectIdentifiers, which bcprov 1.85 also has; 1.85.1 removed it.
    implementation libs.bouncycastle.bcutil
    implementation libs.speed.dial
    implementation(libs.dcerpc) {
        // SMBJ-RPC depends on the JRE flavor of Guava which targets Java 8.
        exclude group: 'com.google.guava', module: 'guava'
        // Prevent promotion of SMBJ version to 0.12.2.
        exclude group: 'com.hierynomus', module: 'smbj'
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    // Transitive dependency of dcerpc (3.4); see the advisory note in gradle/libs.versions.toml.
    implementation libs.commons.lang3
    implementation libs.guava
    // Guava conflicts with com.google.guava:listenablefuture:1.0 pulled in by AndroidX Core
    implementation libs.guava.listenablefuture
    implementation libs.preferencex
    implementation libs.commons.net
    // The LicensesDialog version is pinned; see gradle/libs.versions.toml.
    //noinspection NewerVersionAvailable
    implementation libs.licensesdialog
    implementation libs.simplemenu.preference
    implementation libs.shizuku.api
    implementation(libs.jcifs.ng) {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    implementation platform(libs.coil.bom)
    implementation libs.coil
    implementation libs.coil.gif
    implementation libs.coil.svg
    implementation libs.coil.video
    implementation libs.appiconloader
    implementation libs.fastscroll
    implementation libs.foregroundcompat
    implementation libs.libarchive
    implementation libs.libselinux
    implementation libs.retrofile
    implementation libs.systemuihelper
    implementation libs.ftpserver.core
    implementation libs.mina.core
    // Also a dependency of jCIFS-NG.
    implementation libs.slf4j.android
}
