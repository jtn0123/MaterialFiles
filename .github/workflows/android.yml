name: Android CI

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'
    - name: Build with Gradle
      run: ./gradlew ktlintCheck checkSourceFileLength assembleDebug assembleDebugAndroidTest testDebugUnitTest lintVitalRelease
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 10

  instrumented-tests:

    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'
    - name: Enable KVM for the emulator
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Run the instrumented tests on an API 36 emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 36
        arch: x86_64
        target: google_apis
        profile: pixel_6
        emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
        disable-animations: true
        script: ./gradlew connectedDebugAndroidTest
    - name: Upload instrumented test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: instrumented-test-results
        path: app/build/outputs/androidTest-results/
        retention-days: 10
