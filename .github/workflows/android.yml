name: Android CI

# Pushes to master and every pull request get a run; pushes to other branches do not, so a PR
# branch is built once per push rather than twice (push + pull_request). Use "Run workflow" for
# a branch without a PR.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch or PR cancels the run that is still going for the old head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  checks:
    name: Static checks, unit tests, APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - name: Check out repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: true
    - name: Validate the Gradle wrapper checksum
      uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
    - name: Set up JDK 21
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Set up Gradle (caches, configuration cache, build scan off)
      uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/master' }}
    - name: ktlint, file length rule, unit tests, lint
      run: ./gradlew ktlintCheck checkSourceFileLength testDebugUnitTest lintDebug lintVitalRelease
    - name: Real protocol integration tests (FTP, FTPS, WebDAV, SMB)
      run: python3 tools/network-tests.py
    - name: Assemble the app and the instrumented-test APK
      run: ./gradlew assembleDebug assembleDebugAndroidTest
    - name: Publish the unit test results as a check
      if: always()
      uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
      with:
        name: Unit tests
        path: app/build/test-results/testDebugUnitTest/*.xml
        reporter: java-junit
        fail-on-error: false
        fail-on-empty: false
    - name: Upload reports (unit tests, lint)
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: reports-checks
        path: |
          app/build/reports/tests/
          app/build/reports/lint-results-debug.html
          app/build/reports/ktlint/
        retention-days: 10
    - name: Upload the APKs
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: apks
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
        retention-days: 10

  instrumented-tests:
    name: Instrumented tests (API ${{ matrix.api-level }} emulator)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        # minSdk and the newest platform. Add a level here to widen coverage.
        api-level: [35, 36]

    steps:
    - name: Check out repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: true
    - name: Set up JDK 21
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      with:
        cache-read-only: true
    - name: Enable KVM for the emulator
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Cache the AVD
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      id: avd-cache
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: avd-api${{ matrix.api-level }}-google_apis-x86_64-v1
    - name: Create the AVD snapshot on a cache miss
      if: steps.avd-cache.outputs.cache-hit != 'true'
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
      with:
        api-level: ${{ matrix.api-level }}
        arch: x86_64
        target: google_apis
        profile: pixel_6
        force-avd-creation: false
        emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
        disable-animations: false
        script: echo "AVD snapshot generated"
    - name: Run the instrumented tests
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
      with:
        api-level: ${{ matrix.api-level }}
        arch: x86_64
        target: google_apis
        profile: pixel_6
        force-avd-creation: false
        emulator-options: -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
        disable-animations: true
        script: ./gradlew connectedDebugAndroidTest
    - name: Publish the instrumented test results as a check
      if: always()
      uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
      with:
        name: Instrumented tests (API ${{ matrix.api-level }})
        path: app/build/outputs/androidTest-results/connected/**/*.xml
        reporter: java-junit
        fail-on-error: false
        fail-on-empty: false
    - name: Upload instrumented test results and reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: instrumented-api${{ matrix.api-level }}
        path: |
          app/build/outputs/androidTest-results/
          app/build/reports/androidTests/
          app/build/outputs/connected_android_test_additional_output/
        retention-days: 10
