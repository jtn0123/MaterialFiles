name: Android CI

# Pushes to master and every pull request get a run; pushes to other branches do not, so a PR
# branch is built once per push rather than twice (push + pull_request). Use "Run workflow" for
# a branch without a PR.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch or PR cancels the run that is still going for the old head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Static checks, unit tests, APKs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the test report.
      checks: write
    timeout-minutes: 40
    env:
      ORG_GRADLE_PROJECT_coverage: 'true'

    steps:
    - name: Check out repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: true
    - name: Validate the Gradle wrapper checksum
      uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
    - name: Set up JDK 21
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Set up Gradle (caches, configuration cache, build scan off)
      uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/master' }}
    - name: Check that the dependency verification metadata is complete
      # gradle/verification-metadata.xml is usually regenerated on macOS, which never resolves
      # the Linux-only artifacts (aapt2) and can miss Gradle module files its cache already had
      # as POM-only. Resolving everything the build needs here, on Linux, and diffing the result
      # turns "verification failed" into a diff that says exactly what to add.
      run: |
        ./gradlew --write-verification-metadata sha256 --dry-run ktlintCheck checkSourceFileLength testDebugUnitTest :dav4jvm:test :app:createDebugUnitTestCoverageReport :dav4jvm:jacocoTestReport lintDebug lintVitalRelease assembleDebug assembleDebugAndroidTest
        if ! diff -u gradle/verification-metadata.xml gradle/verification-metadata.dryrun.xml; then
          echo "::error file=gradle/verification-metadata.xml::Missing entries above; add them to gradle/verification-metadata.xml"
          exit 1
        fi
    - name: ktlint, file length rule, unit tests, lint
      run: ./gradlew ktlintCheck checkSourceFileLength testDebugUnitTest :dav4jvm:test lintDebug lintVitalRelease
    - name: Real protocol integration tests (FTP, FTPS, WebDAV, SMB)
      run: python3 tools/network-tests.py :app:createDebugUnitTestCoverageReport :dav4jvm:jacocoTestReport
    - name: Test the coverage-report guard
      run: python3 -m unittest discover -s tools -p 'test_coverage_reports.py'
    - name: Collect unit coverage reports
      run: python3 tools/coverage-reports.py unit
    - name: Upload unit coverage
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-unit
        path: coverage/*.xml
        if-no-files-found: error
        retention-days: 10
    - name: Assemble the app and the instrumented-test APK
      run: ./gradlew assembleDebug assembleDebugAndroidTest
    - name: Publish the unit test results as a check
      if: always()
      uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
      with:
        name: Unit tests
        path: |
          app/build/test-results/testDebugUnitTest/*.xml
          dav4jvm/build/test-results/test/*.xml
        reporter: java-junit
        fail-on-error: false
        fail-on-empty: false
    - name: Upload reports (unit tests, lint)
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: reports-checks
        path: |
          app/build/reports/tests/
          app/build/reports/lint-results-debug.html
          app/build/reports/ktlint/
        retention-days: 10
    - name: Upload the APKs
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: apks
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
        retention-days: 10

  screenshots:
    name: Screenshots (API 35 emulator)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 45

    steps:
    - name: Check out repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: true
    - name: Set up JDK 21
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      with:
        cache-read-only: true
    - name: Enable KVM for the emulator
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Cache the AVD
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      id: avd-cache
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: avd-api35-google_apis-x86_64-v1
    - name: Build the debug APK
      run: ./gradlew assembleDebug
    - name: Install Pillow for the comparison
      run: >-
        python3 -m pip install --quiet --require-hashes --only-binary :all:
        -r scripts/screenshots/requirements.txt
    - name: Capture the screenshots
      # The screens the insets, the drawer and the viewers depend on; see scripts/screenshots.
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
      with:
        api-level: 35
        arch: x86_64
        target: google_apis
        profile: pixel_6
        force-avd-creation: false
        emulator-options: -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
        disable-animations: true
        script: |
          adb install -r -t app/build/outputs/apk/debug/app-debug.apk
          scripts/screenshots/capture.sh emulator-5554 screenshots/current app/src/androidTest/assets/clip.mp4
    - name: Compare with the committed baseline
      # The baseline in screenshots/baseline/api35 comes from this job's artifact, since screenshots
      # from other emulators do not match pixel for pixel. After an intended UI change, replace it
      # with the artifact of the change's run (see screenshots/README.md).
      run: |
        if [ -d screenshots/baseline/api35 ]; then
          python3 scripts/screenshots/compare.py screenshots/baseline/api35 screenshots/current
        else
          echo "::notice::No screenshots/baseline/api35 yet; commit the artifact of this run to start comparing"
        fi
    - name: Upload the screenshots
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: screenshots-api35
        path: screenshots/current
        retention-days: 30

  instrumented-tests:
    name: Instrumented tests (API ${{ matrix.api-level }} emulator)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the test report.
      checks: write
    needs: checks
    timeout-minutes: 50
    env:
      ORG_GRADLE_PROJECT_coverage: 'true'
    strategy:
      fail-fast: false
      matrix:
        # minSdk and the newest platform. Add a level here to widen coverage.
        api-level: [35, 36]

    steps:
    - name: Check out repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: true
    - name: Set up JDK 21
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      with:
        cache-read-only: true
    - name: Enable KVM for the emulator
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Cache the AVD
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      id: avd-cache
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: avd-api${{ matrix.api-level }}-google_apis-x86_64-v1
    - name: Create the AVD snapshot on a cache miss
      if: steps.avd-cache.outputs.cache-hit != 'true'
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
      with:
        api-level: ${{ matrix.api-level }}
        arch: x86_64
        target: google_apis
        profile: pixel_6
        force-avd-creation: false
        emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
        disable-animations: false
        script: echo "AVD snapshot generated"
    - name: Run the instrumented tests
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
      with:
        api-level: ${{ matrix.api-level }}
        arch: x86_64
        target: google_apis
        profile: pixel_6
        force-avd-creation: false
        emulator-options: -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
        disable-animations: true
        script: ./gradlew createDebugAndroidTestCoverageReport
    - name: Collect Android coverage report
      run: python3 tools/coverage-reports.py android --api-level ${{ matrix.api-level }}
    - name: Upload Android coverage
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-android-${{ matrix.api-level }}
        path: coverage/*.xml
        if-no-files-found: error
        retention-days: 10
    - name: Publish the instrumented test results as a check
      if: always()
      uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
      with:
        name: Instrumented tests (API ${{ matrix.api-level }})
        path: app/build/outputs/androidTest-results/connected/**/*.xml
        reporter: java-junit
        fail-on-error: false
        fail-on-empty: false
    - name: Upload instrumented test results and reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: instrumented-api${{ matrix.api-level }}
        path: |
          app/build/outputs/androidTest-results/
          app/build/reports/androidTests/
          app/build/outputs/connected_android_test_additional_output/
        retention-days: 10

  sonar:
    name: SonarCloud with test coverage
    needs: [checks, instrumented-tests]
    # Fork PRs still run tests and produce coverage, but never receive the analysis secret.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Check out repository with history
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
        submodules: true
    - name: Set up JDK 21
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      with:
        cache-read-only: true
    - name: Download all coverage reports
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        pattern: coverage-*
        path: coverage
        merge-multiple: true
    - name: Verify coverage reports
      run: python3 tools/coverage-reports.py verify
    - name: Build classes and native compilation database for analysis
      run: ./gradlew :app:assembleDebug :dav4jvm:classes
    - name: Analyze source and import coverage
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        if [ -z "$SONAR_TOKEN" ]; then
          echo "::error::Add the SONAR_TOKEN repository secret and switch the SonarCloud project from automatic to CI-based analysis. See docs/DEVELOPMENT.md."
          exit 1
        fi
        ./gradlew sonar -Dsonar.qualitygate.wait=true
